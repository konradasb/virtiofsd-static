---
name: build

# Every push and pull request builds virtiofsd for both architectures. A tag,
# v1.14.0-1, also publishes the build as a release. See README.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh ${{ matrix.arch }} out

      # The runner is not the Alpine it was built on: a binary that runs here
      # needs nothing of the host's.
      - name: Run it outside its build image
        run: out/virtiofsd-${{ matrix.arch }} --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtiofsd-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # To create the release and upload to it.
      contents: write
      # To sign the checksums with cosign, keyless, as this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      # Each release carries the exact source it was built from, and
      # virtiofsd's licences, beside the binaries.
      - name: Add virtiofsd's source and licences
        run: |
          source virtiofsd.env
          crate=virtiofsd-$VIRTIOFSD_VERSION.crate
          curl -fsSL -o "out/$crate" "https://static.crates.io/crates/virtiofsd/$crate"
          echo "$VIRTIOFSD_SHA256  out/$crate" | sha256sum --check
          tar -xzf "out/$crate" -C out --strip-components=1 \
            "virtiofsd-$VIRTIOFSD_VERSION/LICENSE-APACHE" \
            "virtiofsd-$VIRTIOFSD_VERSION/LICENSE-BSD-3-Clause"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Checksum and sign
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source virtiofsd.env
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "virtiofsd $VIRTIOFSD_VERSION, static (${GITHUB_REF_NAME##*-})" \
            --notes "virtiofsd $VIRTIOFSD_VERSION from crates.io, linked statically against musl, libcap-ng and libseccomp, for x86_64 and aarch64 Linux. The crate it was built from and virtiofsd's licences are attached. Verify the downloads against SHA256SUMS, and SHA256SUMS with cosign; see the README."
